[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["dzur658"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
anyhow = "1.0.104"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
d1-yesno = { git = "https://github.com/dzur658/liquid-d1-3b-ort-implementation", branch = "master" }

# patch essax-rs upstream of tokenizers to fix static_crt() build bug on Windows
[patch.crates-io]
esaxx-rs = { git = "https://github.com/dzur658/esaxx-rs", branch = "main" }

[features]
cuda = ["d1-yesno/cuda"]
directml = ["d1-yesno/directml"]
coreml = ["d1-yesno/coreml"]
